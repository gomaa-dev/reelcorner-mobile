name: reelcorner_blocks_ui

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "packages/reelcorner_blocks_ui/**"
      - ".github/workflows/reelcorner_blocks_ui.yaml"
    branches:
      - main

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: 3.35.7
      working_directory: packages/reelcorner_blocks_ui
